[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mobility-ingest"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy==2.1.6",
    "alembic==1.20.1",
    "PyMySQL==1.2.3",
    "jsonschema==4.26.0",
    "confluent-kafka==2.16.1",
    "opensearch-py==3.2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs MySQL, Kafka or OpenSearch from docker-compose.test.yml"]
